# Nginx site config — salin ke /etc/nginx/sites-available/bms
# Domain: bms.adbr.my.id

server {
    listen 80;
    listen [::]:80;
    server_name bms.adbr.my.id;

    root /var/www/bms/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/bms-access.log;
    error_log  /var/log/nginx/bms-error.log;
}
