services:
  bms-php:
    build: .
    container_name: bms-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - apps-network

  bms-nginx:
    image: nginx:alpine
    container_name: bms-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bms-php
    networks:
      - apps-network

  bms-queue:
    build: .
    container_name: bms-queue
    restart: unless-stopped
    command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - bms-php
    networks:
      - apps-network

  bms-scheduler:
    build: .
    container_name: bms-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - bms-php
    networks:
      - apps-network

networks:
  apps-network:
    external: true
